<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a5d8f">
  <title>Offline | GG Cash Book</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#fff8f0;color:#1a1a3e}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:420px;border:1px solid #4a5d8f44;border-radius:24px;padding:32px;background:#fff}
    img{width:64px;height:64px}h1{font-size:28px}p{line-height:1.7;color:#586176}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;background:#4a5d8f;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
    a:focus-visible{outline:3px solid #4a5d8f;outline-offset:5px}
    @media(prefers-color-scheme:dark){:root{background:#0f1220;color:#f5efe4}main{background:#171b2f}p{color:#b4bdd1}}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Connect to the internet to open your private cash books. Account pages and financial records are not cached on this device.</p>
    <p>No offline changes or payments have been queued. Your saved MongoDB records are unchanged.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
